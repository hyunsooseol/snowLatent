name: multilpa
title: Multilevel LPA
menuGroup: snowLatent
menuSubgroup: LPA
menuTitle: Multilevel LPA
version: 1.0.0
jas: '1.2'
options:
- name: data
  type: Data
  requiresMissings: true
- name: vars
  title: Variables
  type: Variables
  suggested:
  - continuous
  permitted:
  - numeric
- name: group
  title: Grouping variable
  type: Variable
  suggested:
  - nominal
  - ordinal
  permitted:
  - factor
  - numeric
- name: nProfiles
  title: Individual profiles
  type: Integer
  default: 2
  min: 2
  max: 10
- name: nGroupClasses
  title: Group-level latent classes
  type: Integer
  default: 2
  min: 1
  max: 6
- name: variance
  title: Within-profile variances
  type: List
  default: varying
  options:
  - name: varying
    title: Vary across profiles
  - name: equal
    title: Equal across profiles
- name: missing
  title: Missing indicators
  type: List
  default: complete
  options:
  - name: complete
    title: Complete cases
  - name: fiml
    title: Available indicators (FIML)
- name: nStarts
  title: Random starts
  type: Integer
  default: 20
  min: 2
  max: 200
- name: maxIter
  title: Maximum iterations
  type: Integer
  default: 1000
  min: 10
  max: 10000
- name: seed
  title: Random seed
  type: Integer
  default: 2026
  min: 1
  max: 2147483646
- name: compare
  title: Compare additional models
  type: Bool
  default: false
- name: models
  title: Additional models (profiles / group classes)
  type: String
  default: 2/1, 3/2
- name: run
  title: Run
  type: Action
- name: showModelFit
  title: Model fit and comparison
  type: Bool
  default: TRUE
- name: showClassification
  title: Classification quality and posterior sizes
  type: Bool
  default: false
- name: showEntropy
  title: Classification entropy
  type: Bool
  default: false
- name: showProfiles
  title: Individual profile characteristics
  type: Bool
  default: false
- name: showGroupClasses
  title: Estimated group-class proportions
  type: Bool
  default: false
- name: showComposition
  title: Individual profile composition by group class
  type: Bool
  default: false
- name: profilePlot
  title: Profile plot
  type: Bool
  default: false
- name: profileCI
  title: 95% confidence intervals
  type: Bool
  default: false
- name: heatmapPlot
  title: Profile heatmap (z-scores)
  type: Bool
  default: false
- name: comparisonPlot
  title: Model comparison plot (AIC / BIC)
  type: Bool
  default: false
- name: compositionPlot
  title: Group-class composition plot
  type: Bool
  default: false
- name: plotZ
  title: Standardized profile plot
  type: Bool
  default: true
- name: showStarts
  title: Starting-value diagnostics
  type: Bool
  default: false
- name: saveClasses
  title: Modal classifications
  type: Output
- name: saveProbabilities
  title: Posterior probabilities
  type: Output
- name: individualCovariates
  title: Individual-level numeric covariates
  type: Variables
  suggested:
  - continuous
  permitted:
  - numeric
  default: []
- name: groupCovariates
  title: Group-level numeric covariates
  type: Variables
  suggested:
  - continuous
  permitted:
  - numeric
  default: []
- name: individualOutcomes
  title: Individual-level continuous outcomes
  type: Variables
  suggested:
  - continuous
  permitted:
  - numeric
  default: []
- name: groupOutcomes
  title: Group-level continuous outcomes
  type: Variables
  suggested:
  - continuous
  permitted:
  - numeric
  default: []
- name: r3Adjust
  title: Multiplicity correction
  type: List
  default: holm
  options:
  - name: holm
    title: Holm
  - name: BH
    title: Benjamini-Hochberg
  - name: bonferroni
    title: Bonferroni
  - name: none
    title: None
- name: bchAdjust
  title: Multiplicity correction
  type: List
  default: holm
  options:
  - name: holm
    title: Holm
  - name: BH
    title: Benjamini-Hochberg
  - name: bonferroni
    title: Bonferroni
  - name: none
    title: None
- name: showR3Individual
  title: Individual-profile predictors
  type: Bool
  default: false
- name: showR3Group
  title: Group-class predictors
  type: Bool
  default: false
- name: showBCHIndividualMeans
  title: Individual-profile outcome means
  type: Bool
  default: false
- name: showBCHIndividualPairs
  title: Individual-profile pairwise differences
  type: Bool
  default: false
- name: showBCHGroupMeans
  title: Group-class outcome means
  type: Bool
  default: false
- name: showBCHGroupPairs
  title: Group-class pairwise differences
  type: Bool
  default: false
- name: individualFactors
  title: Individual-level factors
  type: Variables
  suggested:
  - nominal
  - ordinal
  permitted:
  - factor
  default: []
- name: individualRefLevels
  title: Individual-level reference categories
  type: Array
  default: []
  template:
    type: Group
    elements:
    - name: var
      type: Variable
    - name: ref
      type: Level
- name: groupFactors
  title: Group-level factors
  type: Variables
  suggested:
  - nominal
  - ordinal
  permitted:
  - factor
  default: []
- name: groupRefLevels
  title: Group-level reference categories
  type: Array
  default: []
  template:
    type: Group
    elements:
    - name: var
      type: Variable
    - name: ref
      type: Level
weightsSupport: none


